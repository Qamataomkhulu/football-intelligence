name: Collect & Analyse (morning pipeline)

on:
  schedule:
    # 05:00 UTC daily - see design doc step 14
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-and-analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pipeline
        env:
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Sync dashboard data for GitHub Pages
        run: |
          mkdir -p docs/data
          cp data/predictions/latest.json docs/data/latest.json
          if [ -f data/predictions/performance.json ]; then
            cp data/predictions/performance.json docs/data/performance.json
          fi

      - name: Commit updated predictions
        run: |
          git config user.name "football-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/predictions/latest.json docs/data/latest.json docs/data/performance.json
          git diff --cached --quiet || git commit -m "Automated pipeline run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
